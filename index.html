<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charlène mon amour ❤️</title>
<meta name="description" content="Appuie pour faire battre mon cœur et récupère ta récompense…">
<meta property="og:type" content="website">
<meta property="og:title" content="Charlène mon amour ❤️">
<meta property="og:description" content="Appuie pour faire battre mon cœur et récupère ta récompense…">
<meta property="og:image" content="https://bastien313.github.io/chacha2/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1a0010">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'%3E%3Cpath d='M50 88C20 65 2 45 2 28C2 12 15 2 28 2C38 2 46 8 50 16C54 8 62 2 72 2C85 2 98 12 98 28C98 45 80 65 50 88Z' fill='%23ff2e63'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5c93;--red:#ff1f5a;--gold:#ffd166;--rose:#ffc2d6;--ink:#2a0015}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0d0009;color:#fff;font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit}

#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#5a0f3c 0%,#2a0720 42%,#0d0009 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#heat{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(65% 55% at 50% 55%,rgba(255,30,70,.6),rgba(255,30,70,0) 72%)}
#app{position:absolute;inset:0;z-index:3}
#fx{z-index:5;pointer-events:none}
#alarm{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;box-shadow:inset 0 0 110px 36px rgba(255,0,40,.95)}
#alarm.on{animation:alarm .26s ease-in-out infinite alternate}
@keyframes alarm{from{opacity:.2}to{opacity:1}}
#flash{position:absolute;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  transition:opacity .8s ease,visibility 0s linear 0s}
.scene.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s ease,visibility 0s linear .8s}

/* ---------- Scène 1 : le cœur ---------- */
.head,.status,.meter{transition:opacity .6s,transform .6s}
.head{position:relative;z-index:1}
.title{font-family:'Great Vibes',cursive;font-weight:400;line-height:.95;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 18px rgba(255,80,140,.55))}
.title span,.wtitle{background:linear-gradient(100deg,#ffd1e0 0%,#ff5c93 30%,#ffd166 50%,#ff5c93 70%,#ffd1e0 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;padding:0 .18em}
.t1{font-size:clamp(64px,19vw,128px)}
.t2{font-size:clamp(34px,9.5vw,64px);margin-top:-.08em}
@keyframes shimmer{to{background-position:-250% 0}}
.subtitle{margin-top:10px;font-size:clamp(15px,4.2vw,20px);color:#ffe3ec;opacity:.92;line-height:1.35}

.heart-zone{position:relative;z-index:2;width:100%;height:clamp(170px,30vh,250px);display:grid;place-items:center;margin:6px 0 2px;--bpm:1.1s}
.heart-halo{position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,60,120,.38),transparent 65%);animation:halo var(--bpm) ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.6}15%{transform:scale(1.08);opacity:1}}
.heart-btn{background:none;border:0;cursor:pointer;padding:0;display:grid;place-items:center;outline:none;position:relative}
.heart-btn:focus-visible{outline:2px dashed var(--gold);outline-offset:10px;border-radius:24px}
.h-grow,.h-shake,.h-idle,.h-beat{display:block}
.h-grow{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#heartSvg{display:block;width:clamp(110px,30vw,150px);height:auto;overflow:visible;
  filter:drop-shadow(0 0 var(--glow,12px) var(--glowc,rgba(255,60,120,.8))) drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.h-idle{animation:idle var(--bpm) ease-in-out infinite}
@keyframes idle{0%,45%,100%{transform:scale(1)}12%{transform:scale(1.07)}22%{transform:scale(1.02)}32%{transform:scale(1.05)}}
.heart-zone.trem .h-shake{animation:trem .12s linear infinite}
.heart-zone.critical .h-shake{animation:trem2 .05s linear infinite}
@keyframes trem{0%,100%{transform:translate(1px,-1px) rotate(-1deg)}25%{transform:translate(-1px,1px) rotate(1deg)}50%{transform:translate(1px,1px)}75%{transform:translate(-1px,-1px) rotate(1deg)}}
@keyframes trem2{0%,100%{transform:translate(4px,-3px) rotate(-3deg)}25%{transform:translate(-4px,3px) rotate(3deg)}50%{transform:translate(3px,4px) rotate(-2deg)}75%{transform:translate(-3px,-4px) rotate(2deg)}}
#cracks path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s ease-out}
.hint{position:absolute;left:calc(50% + 34px);top:calc(50% + 26px);font-size:44px;pointer-events:none;animation:tapHint 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:opacity .3s}
@keyframes tapHint{0%,100%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(-8px,-12px) rotate(-18deg) scale(.9)}}
.status{min-height:1.5em;font-size:clamp(20px,5.6vw,28px);font-weight:700;margin-bottom:10px;text-shadow:0 0 14px rgba(255,80,140,.9),0 3px 0 #7a0030}
.meter{width:min(320px,80vw)}
.meter-row{display:flex;justify-content:space-between;font-size:13px;color:var(--rose);margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase}
.meter-row b{color:var(--gold);letter-spacing:.02em}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;position:relative;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ff8fb4,#ff1f5a 60%,#ffd166);box-shadow:0 0 14px rgba(255,60,120,.9);transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent) no-repeat;background-size:40% 100%;animation:barShine 1.4s linear infinite}
@keyframes barShine{from{background-position:-60% 0}to{background-position:160% 0}}
#heartScene.boom .head,#heartScene.boom .status,#heartScene.boom .meter{opacity:0;transform:scale(.9)}
#heartScene.boom .heart-btn,#heartScene.boom .heart-halo,#heartScene.boom .hint{visibility:hidden}

/* ---------- Scène 2 : la roue ---------- */
.wtitle{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(46px,12vw,80px);line-height:1.1;background-image:linear-gradient(100deg,#fff1a8,#ffd166 35%,#ff8fb4 55%,#ffd166 75%,#fff1a8);filter:drop-shadow(0 0 16px rgba(255,209,102,.5))}
.wmsg{font-size:clamp(17px,4.6vw,22px);font-weight:600;color:#ffe3ec;margin:2px 0 12px;min-height:1.4em;text-shadow:0 0 12px rgba(255,80,140,.8)}
.wmsg.pulse{animation:pulseTxt 1s ease-in-out infinite}
@keyframes pulseTxt{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.wheel-btn{background:none;border:0;padding:0;cursor:pointer;width:min(92vw,58vh,480px);aspect-ratio:500/526;outline:none}
.wheel-btn:focus-visible{outline:2px dashed var(--gold);outline-offset:6px;border-radius:50%}
.wheel-btn svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 26px rgba(255,80,140,.45)) drop-shadow(0 18px 30px rgba(0,0,0,.5))}
#wheelScene:not(.hidden) .wheel-btn{animation:wheelIn 1.3s cubic-bezier(.2,1.25,.4,1) both}
@keyframes wheelIn{from{transform:scale(0) rotate(-540deg);opacity:0}to{transform:none;opacity:1}}
#wheelScene:not(.hidden) .wheel-btn.ready svg{animation:wheelPulse 1.3s ease-in-out infinite}
@keyframes wheelPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bulb{animation:bulb var(--bs,1s) steps(1) infinite}
.bulb.b{animation-delay:calc(var(--bs,1s) / -2)}
@keyframes bulb{0%{fill:#fff6cf}50%{fill:#8a6414}}
.lbl{font:700 26px 'Fredoka',system-ui,sans-serif;letter-spacing:1px}
.lbl.decoded{font-size:23px;letter-spacing:.5px}
.slice.win{animation:winBlink .28s steps(1) infinite}
@keyframes winBlink{50%{fill:#fff6cf}}
#flap{transform-box:fill-box;transform-origin:50% 30%}

/* ---------- Scène 3 : la récompense ---------- */
#rewardScene{overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(90,15,60,.35),rgba(10,0,8,.88))}
.rays{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.17) 0deg 9deg,rgba(255,92,147,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spinRays 30s linear infinite}
#rewardScene.revealed .rays{opacity:1}
@keyframes spinRays{to{transform:rotate(360deg)}}
.drum{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(24px,6.5vw,38px);font-weight:600;color:#ffe3ec;text-shadow:0 0 16px rgba(255,80,140,.9)}
.drum.on{display:flex}
.drum.on span{animation:drumShake .07s linear infinite, drumGrow 2s ease-in both}
@keyframes drumShake{0%,100%{translate:1px 0}50%{translate:-1px 1px}}
@keyframes drumGrow{from{scale:.7;opacity:0}20%{opacity:1}to{scale:1.25}}
.reward{position:relative;z-index:1;font-weight:700;font-size:clamp(28px,9vw,78px);line-height:1.05;min-height:1em}
.reward .line{display:block;white-space:nowrap}
.reward .line:first-child{font-size:1.32em}
.reward .ch{display:inline-block;text-shadow:0 .08em 0 rgba(70,0,35,.6),0 0 .35em rgba(255,120,170,.6);
  animation:chIn .8s cubic-bezier(.2,1.6,.4,1) both,wave 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * 60ms),calc(var(--i) * 90ms + 1.8s)}
@keyframes chIn{0%{transform:translateY(-140px) rotate(-40deg) scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.12em) rotate(5deg)}}
.hat-stage{position:relative;width:200px;height:200px;margin-top:44px;z-index:1}
.cutie-wrap,.hat-wrap{position:absolute;left:0;right:0;display:flex;justify-content:center}
.cutie-wrap{bottom:0}
.hat-wrap{top:-24px;pointer-events:none}
.cutie{width:160px;overflow:visible;cursor:pointer;transform:scale(0);transform-origin:50% 90%;filter:drop-shadow(0 0 24px rgba(255,60,120,.7))}
.hat-stage.pop .cutie{animation:cutieIn .7s cubic-bezier(.2,1.6,.4,1) forwards}
.hat-stage.pop .cutie.alive{transform:scale(1);animation:idle 1s ease-in-out infinite}
.hat-stage.pop .cutie.alive.squish{animation:squish .55s ease-out}
@keyframes cutieIn{to{transform:scale(1)}}
@keyframes squish{0%{transform:scale(1)}25%{transform:scale(1.18,.78)}55%{transform:scale(.94,1.08)}80%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.hat{width:92px;overflow:visible;visibility:hidden;transform-origin:50% 100%;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.hat.drop{visibility:visible;animation:hatDrop 1.1s cubic-bezier(.45,0,.6,1) both}
.hat.landed{visibility:visible;animation:hatWobble 2.4s ease-in-out infinite}
@keyframes hatDrop{0%{transform:translateY(-110vh) rotate(-420deg)}68%{transform:translateY(0) rotate(-10deg) scale(1.12,.8)}80%{transform:translateY(-22px) rotate(-4deg) scale(.94,1.08)}90%{transform:translateY(0) rotate(-12deg) scale(1.04,.96)}100%{transform:translateY(0) rotate(-10deg)}}
@keyframes hatWobble{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-3deg)}}
.fine{font-size:12.5px;color:var(--rose);margin-top:14px;letter-spacing:.03em;line-height:1.55;opacity:0;transition:opacity .8s}
.sign{font-family:'Great Vibes',cursive;font-size:clamp(38px,9vw,56px);color:var(--gold);text-shadow:0 0 18px rgba(255,209,102,.6);opacity:0;transform:translateY(10px);transition:opacity 1s .3s,transform 1s .3s}
.replay{margin-top:8px;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff5c93,#c9184a);border:0;border-radius:99px;padding:12px 26px;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,40,100,.45),inset 0 1px 0 rgba(255,255,255,.35);opacity:0;transform:scale(.8);transition:opacity .6s .7s,transform .6s .7s;pointer-events:none}
#rewardScene.done .fine,#rewardScene.done .sign,#rewardScene.done .replay{opacity:1;transform:none}
#rewardScene.done .replay{pointer-events:auto}

#mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:18px;cursor:pointer}

@media (max-height:640px){
  .t1{font-size:clamp(50px,15vw,96px)}
  .t2{font-size:clamp(28px,8vw,48px)}
  .heart-zone{height:150px}
  .hat-stage{transform:scale(.8);margin:10px 0 -16px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="heat"></div>

  <main id="app">
    <!-- Scène 1 -->
    <section id="heartScene" class="scene">
      <header class="head">
        <h1 class="title"><span class="t1">Charlène</span><span class="t2">mon amour</span></h1>
        <p class="subtitle">Appuie pour faire battre mon cœur<br>et récupère ta récompense ✨</p>
      </header>
      <div class="heart-zone" id="heartZone">
        <div class="heart-halo"></div>
        <button id="heartBtn" class="heart-btn" aria-label="Fais battre mon cœur">
          <span class="h-grow" id="hGrow"><span class="h-shake"><span class="h-idle"><span class="h-beat" id="hBeat">
            <svg id="heartSvg" viewBox="0 0 100 90" aria-hidden="true">
              <defs>
                <radialGradient id="hg" cx="35%" cy="28%" r="80%">
                  <stop id="hs0" offset="0" stop-color="#ff9cbf"/>
                  <stop id="hs1" offset=".45" stop-color="#ff4d8d"/>
                  <stop id="hs2" offset="1" stop-color="#b3124f"/>
                </radialGradient>
                <filter id="crackGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="1.4" result="b"/>
                  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <path d="M50 88C20 65 2 45 2 28C2 12 15 2 28 2C38 2 46 8 50 16C54 8 62 2 72 2C85 2 98 12 98 28C98 45 80 65 50 88Z" fill="url(#hg)"/>
              <ellipse cx="27" cy="21" rx="12" ry="6.5" fill="#fff" opacity=".45" transform="rotate(-32 27 21)"/>
              <ellipse cx="17" cy="35" rx="2.6" ry="3.6" fill="#fff" opacity=".35"/>
              <g id="cracks" fill="none" stroke="#fff6c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#crackGlow)">
                <path pathLength="1" d="M50 18L46 29L53 37L47 47L52 58"/>
                <path pathLength="1" d="M26 12L33 22L29 31L38 37"/>
                <path pathLength="1" d="M77 14L70 25L76 33L66 40"/>
                <path pathLength="1" d="M10 36L21 41L17 50L28 54"/>
                <path pathLength="1" d="M90 38L79 45L83 53L72 57"/>
                <path pathLength="1" d="M52 58L45 66L51 73L47 80"/>
              </g>
            </svg>
          </span></span></span></span>
        </button>
        <div class="hint" id="hint" aria-hidden="true">👆</div>
      </div>
      <p class="status" id="status">&nbsp;</p>
      <div class="meter" aria-hidden="true">
        <div class="meter-row"><span>Amour-o-mètre</span><b id="pct">0 %</b></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </section>

    <!-- Scène 2 -->
    <section id="wheelScene" class="scene hidden">
      <h2 class="wtitle">La Roue de l'Amour</h2>
      <p class="wmsg pulse" id="wheelMsg">Appuie pour faire tourner la roue</p>
      <button class="wheel-btn" id="wheelBtn" aria-label="Faire tourner la roue">
        <svg id="wheel" viewBox="-250 -276 500 526" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff1a8"/><stop offset=".35" stop-color="#ffc93c"/><stop offset=".65" stop-color="#b8860b"/><stop offset="1" stop-color="#ffe17d"/>
            </linearGradient>
            <radialGradient id="wShade"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
            <radialGradient id="hub" cx="40%" cy="35%"><stop offset="0" stop-color="#fff6cf"/><stop offset=".5" stop-color="#ffc93c"/><stop offset="1" stop-color="#9a6a00"/></radialGradient>
            <linearGradient id="pin" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#c9184a"/></linearGradient>
            <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle r="246" fill="url(#gold)"/>
          <circle r="237" fill="#4a0a2c"/>
          <g id="bulbs" filter="url(#bglow)"></g>
          <circle r="219" fill="url(#gold)"/>
          <g id="wheelRot"></g>
          <ellipse cx="-70" cy="-110" rx="130" ry="55" fill="#fff" opacity=".09" transform="rotate(-32 -70 -110)"/>
          <circle r="50" fill="url(#hub)" stroke="#7a4a00" stroke-width="3"/>
          <path d="M50 88C20 65 2 45 2 28C2 12 15 2 28 2C38 2 46 8 50 16C54 8 62 2 72 2C85 2 98 12 98 28C98 45 80 65 50 88Z" transform="translate(-24 -21.6) scale(.48)" fill="#ff2e63" stroke="#fff6cf" stroke-width="4"/>
          <g transform="translate(0 -236)"><g id="flap">
            <path d="M0 46L-22 0A24 24 0 1 1 22 0Z" fill="url(#pin)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
            <circle cy="-6" r="7" fill="#fff6cf"/>
          </g></g>
        </svg>
      </button>
    </section>

    <!-- Scène 3 -->
    <section id="rewardScene" class="scene hidden">
      <div class="rays"></div>
      <div class="drum" id="drum"><span>Et ta récompense est…</span></div>
      <h2 class="reward" id="reward" aria-live="polite"></h2>
      <div class="hat-stage" id="hatStage">
        <div class="cutie-wrap">
          <svg class="cutie" id="cutie" viewBox="0 0 100 90" role="img" aria-label="Mon cœur">
            <defs>
              <radialGradient id="cg" cx="35%" cy="28%" r="80%">
                <stop offset="0" stop-color="#ffb3cc"/><stop offset=".45" stop-color="#ff4d8d"/><stop offset="1" stop-color="#b3124f"/>
              </radialGradient>
            </defs>
            <path d="M50 88C20 65 2 45 2 28C2 12 15 2 28 2C38 2 46 8 50 16C54 8 62 2 72 2C85 2 98 12 98 28C98 45 80 65 50 88Z" fill="url(#cg)"/>
            <ellipse cx="25" cy="20" rx="10" ry="5.5" fill="#fff" opacity=".45" transform="rotate(-32 25 20)"/>
            <g class="eyes">
              <ellipse cx="37" cy="40" rx="5" ry="6.5" fill="#2a0015"/>
              <ellipse cx="63" cy="40" rx="5" ry="6.5" fill="#2a0015"/>
              <circle cx="38.8" cy="37.6" r="1.9" fill="#fff"/>
              <circle cx="64.8" cy="37.6" r="1.9" fill="#fff"/>
            </g>
            <ellipse cx="27" cy="52" rx="7" ry="4" fill="#ff9ab8" opacity=".75"/>
            <ellipse cx="73" cy="52" rx="7" ry="4" fill="#ff9ab8" opacity=".75"/>
            <path d="M42 53Q50 62 58 53" fill="none" stroke="#2a0015" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hat-wrap">
          <svg class="hat" id="hat" viewBox="0 0 100 124" role="img" aria-label="Chapeau pointu">
            <defs>
              <clipPath id="coneClip"><path d="M50 10L90 108Q50 122 10 108Z"/></clipPath>
              <linearGradient id="coneShade" x1="0" x2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
              </linearGradient>
            </defs>
            <g clip-path="url(#coneClip)">
              <rect width="100" height="124" fill="#ff3d7f"/>
              <g id="hatStripes" transform="rotate(-28 50 60)"></g>

/* ================= Canvas ================= */
const stage = $('#stage');
const bg = $('#bg'), bgx = bg.getContext('2d');
const fx = $('#fx'), fxx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {

  for (const c of [bg, fx]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }

/* --- Fond : étoiles scintillantes + cœurs qui flottent --- */
let stars = [], floaters = [];
function newFloater(init) {
  return { x: rand(0, W), y: init ? rand(0, H) : H + 40, s: rand(8, 26), v: rand(12, 36), sw: rand(.4, 1.3), p: rand(0, TAU), a: rand(.06, .22), c: pick(['#ff5c93', '#ff8fb4', '#ff2e63', '#ffc2d6']) };
}

  stars = Array.from({ length: Math.round(W * H / 8000) }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.3, 1.4), p: rand(0, TAU), s: rand(.5, 2.2) }));

}

  bgx.clearRect(0, 0, W, H);

    bgx.globalAlpha = .15 + .6 * (.5 + .5 * Math.sin(t * s.s + s.p));
    bgx.beginPath(); bgx.arc(s.x, s.y, s.r, 0, TAU); bgx.fill();

/* --- Les petits nageurs --- */
const sperms = [], parts = [];
let formation = null;
const SPERM_COLORS = ['#ff3d7f', '#ff5c93', '#ff2e63', '#ff7aa8', '#ff4f6d', '#ff8fb4'];
const TX = new Float32Array(11), TY = new Float32Array(11), TW = new Float32Array(11);

class Sperm {
  constructor(x, y, a, v, size, o = {}) {
    this.x = x; this.y = y; this.a = a; this.v = v; this.size = size;
    this.phase = rand(0, TAU); this.beat = rand(14, 20); this.color = pick(SPERM_COLORS);

    this.cruise = o.cruise ?? rand(80, 150); this.drag = o.drag ?? 1.2; this.seed = rand(0, 100);
    this.tail = 1; this.tx = 0; this.ty = 0; this.maxV = 600; this.arrived = false; this.rest = -Math.PI / 2; this.fleeA = 0; this.alpha = 1;

      const tx = cx + (this.tx - cx) * k, ty = cy + (this.ty - cy) * k;

/* --- Particules génériques --- */
function addPart(o) { parts.push(Object.assign({ age: 0, life: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, rot: 0, vr: 0, size: 10, color: '#fff', alpha: 1 }, o)); }
function drawPart(c, p) {
  const u = clamp(p.age / p.life, 0, 1);
  switch (p.type) {
    case 'heart': {
      c.globalAlpha = p.alpha * (1 - u * u); c.fillStyle = p.color;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); const s = p.size / 100; c.scale(s, s); c.translate(-50, -45); c.fill(HEART); c.restore();

    }
    case 'shard':
      c.globalAlpha = 1 - u * u; c.fillStyle = p.color;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.beginPath(); p.pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.fill();

    }

}

function burstHearts(x, y, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(.35, 1) * spd;
    addPart({ type: 'heart', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 260, drag: 1.3, rot: rand(-.5, .5), vr: rand(-4, 4), size: rand(8, 20), color: pick(LOVE_COLORS), life: rand(.9, 1.8) });
  }

    const a = rand(0, TAU), v = rand(.3, 1.2) * spd;
    addPart({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 2.5, size: rand(1.5, 3.5), color: pick(['#ffb3cf', '#fff3b0', '#ff8fb4']), life: rand(.4, .9) });
  }
}
function confettiBurst(x, y, n, a0, a1, v0, v1) {
  for (let i = 0; i < n; i++) {
    const a = rand(a0, a1), v = rand(v0, v1);
    addPart({ type: 'confetti', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 650, drag: 1.2, rot: rand(0, TAU), vr: rand(-8, 8), flip: rand(4, 13), size: rand(7, 13), color: pick(CONFETTI_COLORS), life: rand(3, 4.5) });
  }
}

/* --- Tremblement d'écran & flash --- */
let shakeAmp = 0;
function shake(a) { shakeAmp = Math.max(shakeAmp, a); }
function updateShake(dt) {
  if (shakeAmp < .3) { if (shakeAmp) { stage.style.transform = ''; shakeAmp = 0; } return; }
  shakeAmp *= Math.exp(-dt * 5);
  stage.style.transform = `translate(${rand(-1, 1) * shakeAmp}px,${rand(-1, 1) * shakeAmp}px) rotate(${rand(-1, 1) * shakeAmp * .06}deg)`;
}
function flash(o = 1) { $('#flash').animate([{ opacity: o }, { opacity: 0 }], { duration: 750, easing: 'ease-out' }); }

/* --- Boucle principale --- */
let last = performance.now();
function frame(now) {

    const s = sperms[i];

    if (s.dead()) continue;

    s.draw(fxx);
  }

  if (glow) fxx.shadowBlur = 0;

function samplePoints(drawFn, N) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  drawFn(g);
  const glow = document.createElement('canvas'); glow.width = W; glow.height = H;

  gg.globalCompositeOperation = 'source-in'; gg.fillStyle = '#ff5c93'; gg.fillRect(0, 0, W, H);
  const data = g.getImageData(0, 0, W, H).data;
  let count = 0;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (data[(y * W + x) * 4 + 3] > 128) count++;
  const step = Math.max(5, Math.sqrt(count * 4 / N));
  const pts = [];
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) {
    if (data[((y | 0) * W + (x | 0)) * 4 + 3] > 128) pts.push({ x: x + rand(-1, 1), y: y + rand(-1, 1) });
  }
  return { pts: shuffle(pts), step, glow };
}
async function computeFormations() {
  try { await document.fonts.load('700 100px Fredoka'); } catch (e) {}
  const N = Math.round(clamp(W * H / 2000, 300, 520));
  const cy = H * .46;
  const text = samplePoints(g => {
    const font = s => `700 ${s}px Fredoka, system-ui, sans-serif`;
    let fs = Math.min(H * .26, 400), lines = ["JE T'AIME"];
    g.font = font(fs);
    const w = g.measureText(lines[0]).width;
    if (w > W * .9) {
      const fs1 = fs * W * .9 / w;
      if (fs1 < Math.min(90, H * .14)) { lines = ['JE', "T'AIME"]; fs = Math.min(fs * W * .86 / g.measureText("T'AIME").width, H * .2); }
      else fs = fs1;
    }
    g.font = font(fs); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    lines.forEach((l, i) => g.fillText(l, W / 2, cy + (i - (lines.length - 1) / 2) * fs * .95));
  }, N);
  const heart = samplePoints(g => {
    const s = Math.min(W * .8, H * .6) / 100;
    g.translate(W / 2, cy); g.scale(s, s); g.translate(-50, -45); g.fillStyle = '#fff'; g.fill(HEART);
  }, N);
  return { text: text.pts, heart: heart.pts, textGlow: text.glow, heartGlow: heart.glow, count: Math.max(text.pts.length, heart.pts.length), size: clamp(Math.min(text.step, heart.step) * .065, .5, .95), cy };
}

}

  Sound.init(); Sound.beat(); vibrate(20);
  cutie.classList.remove('squish'); void cutie.getBoundingClientRect(); cutie.classList.add('squish');
  hat.animate([{ transform: 'translateY(0) rotate(-10deg)' }, { transform: 'translateY(-38px) rotate(8deg)', offset: .4 }, { transform: 'translateY(0) rotate(-10deg)' }], { duration: 520, easing: 'ease-out' });
  const r = cutie.getBoundingClientRect();
  burstHearts(r.left + r.width / 2, r.top + r.height / 2, 14, 380);
});
hat.addEventListener('click', () => {
  if (!hat.classList.contains('landed')) return;
  Sound.init(); Sound.horn();
  hat.animate([{ transform: 'rotate(-10deg)' }, { transform: 'translateY(-50px) rotate(350deg)', offset: .6 }, { transform: 'rotate(710deg)' }], { duration: 800, easing: 'ease-in-out' });
  const p = hatPos(); confettiBurst(p.x, p.y, 30, -Math.PI * .9, -Math.PI * .1, 250, 700);
});
$('#replay').addEventListener('click', () => {
  Sound.init(); Sound.pop();
  rewardScene.classList.add('hidden');
  rewardScene.classList.remove('revealed', 'done');
  hatStage.classList.remove('pop');
  hat.classList.remove('drop', 'landed');
  cutie.classList.remove('alive', 'squish');
  setTimeout(() => { rewardEl.innerHTML = ''; }, 800);
  spun = false; spinning = false; resetWheelLabels();
  resetHeart();
  heartScene.classList.remove('hidden', 'boom');
  state.scene = 'heart';
});

/* ================= Petits bonus ================= */
heartBtn.addEventListener('click', onHeartTap);
$('#mute').addEventListener('click', e => { Sound.init(); const m = Sound.toggle(); e.currentTarget.textContent = m ? '🔇' : '🔊'; e.currentTarget.setAttribute('aria-label', m ? 'Activer le son' : 'Couper le son'); });

// traînée de petits cœurs sous le doigt / la souris
let lastTrail = 0;
addEventListener('pointermove', e => {
  const now = performance.now();
  if (now - lastTrail < 40) return;
  lastTrail = now;
  addPart({ type: 'heart', x: e.clientX, y: e.clientY, vx: rand(-20, 20), vy: rand(-70, -25), size: rand(6, 11), color: pick(LOVE_COLORS), rot: rand(-.4, .4), life: .8 });
}, { passive: true });

// de temps en temps, un petit nageur égaré traverse l'écran
setInterval(() => {
  if (state.scene === 'heart' || formation || document.hidden) return;
  const left = Math.random() < .5;
  sperms.push(new Sperm(left ? -30 : W + 30, rand(H * .1, H * .9), left ? rand(-.3, .3) : Math.PI + rand(-.3, .3), 130, rand(.8, 1.1), { life: 14, cruise: rand(90, 130), drag: 1 }));
}, 3200);

/* ================= Démarrage ================= */
addEventListener('resize', resize);
resize();
buildWheel();
buildHat();
resetHeart();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
