<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La vraie vie de Raphaël</title>
<meta property="og:title" content="La vraie vie de Raphaël">
<meta property="og:description" content="Dessin animé 2D : un électronicien, un bœuf pas frais, des toilettes qui crient, une super turbine… et un atelier qui s'écroule.">
<meta name="description" content="Dessin animé 2D : un électronicien, un bœuf pas frais, des toilettes qui crient, une super turbine… et un atelier qui s'écroule.">
<meta name="theme-color" content="#101a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2386c956' stroke='%232a0f2e' stroke-width='6'/%3E%3Ccircle cx='34' cy='42' r='7' fill='%23fff' stroke='%232a0f2e' stroke-width='4'/%3E%3Ccircle cx='66' cy='42' r='7' fill='%23fff' stroke='%232a0f2e' stroke-width='4'/%3E%3Cpath d='M32 68Q50 58 68 68' fill='none' stroke='%232a0f2e' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101a24;--green:#86c956;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:#fff;font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 16px}
#stage{position:relative;width:min(100%,calc((100vh - 84px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%}
#start,#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;transition:opacity .4s}
#start{background:radial-gradient(circle at 50% 40%,#2c5a3a,#101a24 75%)}
#end{background:transparent;pointer-events:none;justify-content:flex-end;padding-bottom:2.5%}
#end button{pointer-events:auto}
#start.hide,#end.hide{opacity:0;pointer-events:none}
#start.hide button,#end.hide button{pointer-events:none}
h1{font-family:'Bangers','Fredoka',sans-serif;font-weight:400;letter-spacing:.04em;font-size:clamp(28px,6vw,64px);line-height:1;color:var(--green);text-shadow:0 3px 0 #2c5a3a,0 6px 18px rgba(0,0,0,.5)}
#start p{max-width:36em;font-size:clamp(13px,2vw,18px);opacity:.85}
.big{font-family:inherit;font-weight:700;font-size:clamp(16px,2.6vw,24px);color:#10230f;background:linear-gradient(135deg,#b8f06e,#86c956);border:0;border-radius:999px;padding:.7em 1.6em;cursor:pointer;box-shadow:0 6px 0 #4b7a2c,0 10px 24px rgba(134,201,86,.4);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #4b7a2c}
#bar{width:min(100%,calc((100vh - 84px) * 16 / 9));display:flex;align-items:center;gap:10px}
#bar button{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#22384a;color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
#bar button:hover{background:#2f4c64}
#seek{flex:1;accent-color:var(--green);height:24px}
#time{flex:none;font-size:13px;opacity:.7;min-width:5.2em;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){#time{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Dessin animé : la vraie vie de Raphaël, électronicien, du trajet vers le travail jusqu'au retour à la maison"></canvas>
    <div id="start">
      <h1>La vraie vie<br>de Raphaël</h1>
      <p>Un électronicien, un bœuf loak loak pas très frais, des toilettes qui crient, une super turbine… et un atelier qui s'écroule.</p>
      <button class="big" id="go">▶ Lancer l'animation</button>
    </div>
    <div id="end" class="hide"><button class="big" id="again">↻ Rejouer</button></div>
  </div>
  <div id="bar">
    <button id="pp" title="Pause / lecture" aria-label="Pause / lecture">▶</button>
    <button id="rs" title="Recommencer" aria-label="Recommencer">↺</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position dans l'animation">
    <span id="time">0:00</span>
    <button id="snd" title="Son" aria-label="Son">🔊</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Une journée pas comme les autres — dessin animé 2D en un seul fichier.
   Tout est dessiné en direct dans un <canvas> ; l'image ne dépend que
   du temps t (secondes), ce qui permet de rejouer / d'avancer à volonté.
   ===================================================================== */
const cv=document.getElementById('cv'), c=cv.getContext('2d');
const W=960, H=540, GY=430, TOTAL=107;      // GY = sol des scènes d'intérieur
let DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR}
resize();

/* ---------- petits outils ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const mod=(a,n)=>((a%n)+n)%n;
function kf(t,pts,lin){                                   // interpolation par clés
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++)if(t<=pts[i][0]){
    const [t0,v0]=pts[i-1],[t1,v1]=pts[i],k=(t-t0)/(t1-t0);return lerp(v0,v1,lin?k:ease(k))}
  return pts[pts.length-1][1]}
function hexRGB(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mix(a,b,k){const A=hexRGB(a),B=hexRGB(b);return`rgb(${Math.round(lerp(A[0],B[0],k))},${Math.round(lerp(A[1],B[1],k))},${Math.round(lerp(A[2],B[2],k))})`}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fillRR(x,y,w,h,r,col){c.fillStyle=col;rr(x,y,w,h,r);c.fill()}
function ell(x,y,rx,ry,col,rot=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot,0,7);c.fill()}
function circ(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function poly(pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}
function lin(x0,y0,x1,y1,w,col,cap='round'){c.strokeStyle=col;c.lineWidth=w;c.lineCap=cap;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke()}
function grad(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
const HEART=new Path2D('M50 88C20 65 2 45 2 28C2 12 15 2 28 2C38 2 46 8 50 16C54 8 62 2 72 2C85 2 98 12 98 28C98 45 80 65 50 88Z');
function heart(x,y,s,col,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.scale(s/50,s/50);c.translate(-50,-45);c.fillStyle=col;c.fill(HEART);c.restore()}
function star(x,y,r,col,rot=0,n=4,inner=.4){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;c.beginPath();
  for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rad=i%2?r*inner:r;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath();c.fill();c.restore()}
function burst(x,y,r1,r2,n,col,rot=0,outline){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();
  for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rad=i%2?r1:r2*(i%4==0?1:.8);c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath();
  c.fillStyle=col;c.fill();if(outline){c.lineWidth=5;c.strokeStyle=outline;c.lineJoin='round';c.stroke()}c.restore()}
function note(x,y,s,col,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.5,s*.36,-.4,0,7);c.fill();
  c.lineWidth=s*.14;c.strokeStyle=col;c.beginPath();c.moveTo(s*.42,-s*.1);c.lineTo(s*.42,-s*1.3);c.quadraticCurveTo(s*.9,-s*1.1,s*.8,-s*.7);c.stroke();c.restore()}
function txt(s,x,y,size,col,align='center',font='Fredoka'){c.font=`700 ${size}px ${font}, sans-serif`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y)}
/* mot « BD » qui jaillit : POW / CRAC / ATCHOUM … */
function pop(s,x,y,t,t0,dur=1.6,o={}){
  const u=t-t0;if(u<0||u>dur)return;
  const sc=(u<.16?ease(u/.16)*1.3:u<.3?1.3-.3*ease((u-.16)/.14):1)*(o.size||1);
  c.save();c.translate(x,y);c.rotate((o.rot||0)+Math.sin(u*30)*.02*(u<.5?1:0));c.scale(sc,sc);c.globalAlpha=u>dur-.35?(dur-u)/.35:1;
  const fs=o.fs||64;c.font=`${fs}px Bangers, Impact, sans-serif`;c.textAlign='center';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=fs*.2;c.strokeStyle=o.stroke||'#2a0f2e';c.strokeText(s,0,0);c.fillStyle=o.col||'#ffd166';c.fillText(s,0,0);c.restore()}
/* bulle de dialogue */
function bubble(lines,x,y,tx,ty,o={}){
  if(!Array.isArray(lines))lines=[lines];const fs=o.fs||19;
  c.font=`600 ${fs}px Fredoka, sans-serif`;let w=0;lines.forEach(l=>w=Math.max(w,c.measureText(l).width));
  const pw=w+28,ph=lines.length*(fs+5)+18,bx=x-pw/2,by=y-ph/2;
  c.save();c.globalAlpha=o.a??1;
  const ax=clamp(tx,bx+18,bx+pw-18),ay=ty>y?by+ph:by;
  c.fillStyle='#fff';c.strokeStyle='#2a0f2e';c.lineWidth=3;c.lineJoin='round';
  rr(bx,by,pw,ph,16);c.fill();c.stroke();
  c.beginPath();c.moveTo(ax-9,ay);c.lineTo(tx,ty);c.lineTo(ax+9,ay);c.closePath();c.fillStyle='#fff';c.fill();
  c.beginPath();c.moveTo(ax-9,ay);c.lineTo(tx,ty);c.lineTo(ax+9,ay);c.stroke();
  c.beginPath();c.moveTo(ax-8,ay+(ty>y?-1.5:1.5));c.lineTo(ax+8,ay+(ty>y?-1.5:1.5));c.strokeStyle='#fff';c.lineWidth=4;c.stroke();
  c.fillStyle='#2a0f2e';c.textAlign='center';c.textBaseline='middle';
  lines.forEach((l,i)=>c.fillText(l,x,by+9+(fs+5)*(i+.5)));c.restore()}
const bub=(t,a,b)=>t>=a&&t<b?Math.min(1,(t-a)/.15,(b-t)/.2):0;   // fondu d'apparition d'une bulle

/* ---------- le corps humain (dessin par morceaux) ---------- */
const SK0='#f1c29a',SK20='#e3a97f',HAIR='#3a2113',HAIRW='#d9a441';let SK=SK0,SK2=SK20;
function setGreen(g){SK=mix(SK0,'#86c956',g);SK2=mix(SK20,'#6bb244',g)}
let INV=null;                                   // matrice inverse « monde » (pour repérer têtes et mains)
function ik(hx,hy,fx,fy,L1,L2,pickLow){
  let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);const m=L1+L2-.5;
  if(d>m){fx=hx+dx/d*m;fy=hy+dy/d*m;dx=fx-hx;dy=fy-hy;d=m}if(d<1)d=1;
  const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const mx=hx+dx/d*a,my=hy+dy/d*a,k1=[mx-dy/d*h,my+dx/d*h],k2=[mx+dy/d*h,my-dx/d*h];
  const k=pickLow?(k1[1]>k2[1]?k1:k2):(k1[0]>k2[0]?k1:k2);return{kx:k[0],ky:k[1],fx,fy}}
const LU=28,LF=28;                               // longueur bras / avant-bras
/* o : x,y,s,dir,ph(marche,null=immobile),k(assis 0→1),lean,hip,fn,ff(pieds),
       a1,b1,a2,b2 (angles de bras) ou t1,t2 (cibles des mains dans le monde),
       mouth,eyes,brow,tilt,kind('man'|'woman'),outfit('pj'|'work'|'nurse'),propN,propF,blush   */
function person(o){
  setGreen(o.green||0);const tech=o.outfit==='tech';
  const s=o.s||1,dir=o.dir||1,kind=o.kind||'man',outfit=tech?'work':(o.outfit||'work'),k=o.k||0,lean=o.lean||0,walking=o.ph!=null,ph=o.ph||0;
  const bob=walking?-Math.abs(Math.cos(ph))*2.5:0;
  const hipY=o.hip!=null?o.hip:lerp(-66,-38,k)+bob;
  const fN=o.fn||[lerp(walking?Math.sin(ph)*23:8,26,k),lerp(walking?-Math.max(0,Math.cos(ph))*12:0,0,k)];
  const fF=o.ff||[lerp(walking?Math.sin(ph+Math.PI)*23:-8,34,k),lerp(walking?-Math.max(0,Math.cos(ph+Math.PI))*12:0,0,k)];
  const pants=outfit==='pj'?'#5b86c9':outfit==='work'?'#2c3040':'#f1c29a';
  const pants2=outfit==='pj'?'#4a72b0':outfit==='work'?'#22263a':'#dcae86';
  const shoe=kind==='woman'?'#ffffff':outfit==='pj'?'#a35d4a':'#15151c';
  const shirt=outfit==='pj'?'#6fa3e0':outfit==='work'?(tech?'#4a7fc4':'#9cc3ee'):'#ffffff';
  c.save();c.translate(o.x,o.y);c.scale(dir*s,s);
  // jambes
  [[fF,pants2,'#0b0b10'],[fN,pants,shoe]].forEach((L,i)=>{
    const r=ik(0,hipY,L[0][0],L[0][1],35,35);
    c.strokeStyle=L[1];c.lineWidth=kind==='woman'?12:14;c.lineCap='round';c.lineJoin='round';
    c.beginPath();c.moveTo(0,hipY);c.lineTo(r.kx,r.ky);c.lineTo(r.fx,r.fy);c.stroke();
    ell(r.fx+6,r.fy-3,11,5.5,i?L[2]:'#1d1d24')});
  // matrice locale du buste (pour convertir les cibles « monde »)
  const toLocal=(wx,wy)=>{let px=((wx-o.x)/s)*dir,py=(wy-o.y)/s;py-=hipY;
    const cl=Math.cos(lean),sl=Math.sin(lean);return[px*cl+py*sl,-px*sl+py*cl+42]};
  const arm=(a,b,t,sleeve)=>{
    let sx=0,sy=-42,ex,ey,hx,hy;
    if(t){const p=toLocal(t[0],t[1]);const r=ik(0,0,p[0],p[1]-42+42-42+42,LU,LF,true);sx=0;sy=-42;
      const rr2=ik(0,-42,p[0],p[1]-42,LU,LF,true);ex=rr2.kx;ey=rr2.ky;hx=rr2.fx;hy=rr2.fy}
    else{ex=sx+Math.sin(a)*LU;ey=sy+Math.cos(a)*LU;hx=ex+Math.sin(a+b)*LF;hy=ey+Math.cos(a+b)*LF}
    return{sx,sy,ex,ey,hx,hy,sleeve}};
  const sleeveCol=shirt;
  const drawArm=(A,dark)=>{
    c.lineCap='round';c.lineJoin='round';
    c.strokeStyle=dark?(tech?'#3a6aa8':'#7fa8d8'):sleeveCol;if(dark&&outfit==='nurse')c.strokeStyle='#e9d9e2';c.lineWidth=11;
    c.beginPath();c.moveTo(A.sx,A.sy);c.lineTo(A.ex,A.ey);c.stroke();
    c.strokeStyle=dark?SK2:SK;c.lineWidth=9;c.beginPath();c.moveTo(A.ex,A.ey);c.lineTo(A.hx,A.hy);c.stroke();
    circ(A.hx,A.hy,5.6,dark?SK2:SK)};
  const A1=arm(o.a1!=null?o.a1:(walking?-Math.sin(ph)*.65:.05),o.b1!=null?o.b1:(walking?.25:.1),o.t1),
        A2=arm(o.a2!=null?o.a2:(walking?Math.sin(ph)*.65:-.05),o.b2!=null?o.b2:(walking?.25:.1),o.t2);
  c.save();c.translate(0,hipY);c.rotate(lean);
  drawArm(A2,true);
  if(o.propF){c.save();c.translate(A2.hx,A2.hy);c.rotate(-lean);o.propF();c.restore()}
  // buste
  if(kind==='woman'){
    // jupe de la blouse
    poly([[-12,-16],[12,-16],[24,30],[-24,30]],'#ffffff');
    c.strokeStyle='#ff8fb1';c.lineWidth=4;c.beginPath();c.moveTo(-24,28);c.lineTo(24,28);c.stroke();
    fillRR(-13,-48,26,54,9,'#ffffff');
    c.strokeStyle='#ff8fb1';c.lineWidth=3;c.beginPath();c.moveTo(-12,-16);c.lineTo(12,-16);c.stroke();
    // col
    poly([[-5,-48],[6,-48],[1,-38]],'#ff8fb1');
    heart(6,-30,5,'#ff2e63');
  }else{
    fillRR(-15,-49,30,55,10,shirt);
    if(outfit==='pj'){c.save();rr(-15,-49,30,55,10);c.clip();c.fillStyle='rgba(255,255,255,.55)';for(let y=-44;y<6;y+=10)c.fillRect(-15,y,30,3.5);c.restore()}
    if(outfit==='work'){fillRR(-15,-4,30,10,3,'#22263a');if(tech){lin(-4,-48,2,-24,2.2,'#f2c744');fillRR(-1,-26,10,13,2,'#fff');fillRR(0,-25,8,4,1,'#e94560');fillRR(-12,-37,9,11,2,'#3a68a8');lin(-9,-41,-9,-35,2,'#e33');lin(-6,-41,-6,-35,2,'#2a8')}
      else{poly([[8,-48],[13,-48],[14,-14],[10,-8],[6,-14]],'#b3243b');poly([[7,-48],[14,-48],[12,-42],[9,-42]],'#8c1a2d')}}
  }
  // cou
  fillRR(-4,-56,10,12,4,SK2);
  // tête
  c.save();c.translate(0,-46);c.rotate(o.tilt||0);c.translate(3,-21);
  if(INV){const m=c.getTransform(),p=INV.transformPoint(m.transformPoint(new DOMPoint(0,0)));o.out={hx:p.x,hy:p.y}}
  drawHead(o,kind);c.restore();
  // bras proche
  drawArm(A1,false);
  if(o.propN){c.save();c.translate(A1.hx,A1.hy);c.rotate(-lean);o.propN();c.restore()}
  c.restore();c.restore();
  if(INV&&!o.out){o.out={hx:o.x,hy:o.y-140*s}}
  return o.out}

function drawHead(o,kind){
  const R=19,eyes=o.eyes||'open',mouth=o.mouth||0,brow=o.brow||0;
  if(kind==='woman'){                               // chevelure derrière
    c.fillStyle=HAIRW;c.beginPath();c.moveTo(-14,-14);c.bezierCurveTo(-34,-6,-30,30,-20,42);c.lineTo(2,38);c.lineTo(4,-6);c.closePath();c.fill();
    c.fillStyle='#c48f2f';c.beginPath();c.moveTo(-22,20);c.quadraticCurveTo(-14,36,-6,40);c.lineTo(-20,44);c.closePath();c.fill()}
  circ(0,0,R,SK);
  ell(R-1,3,4.6,3.7,SK);
  ell(-5,2,4,5.5,SK2);
  if(kind==='man'){                                  // barbe de trois jours
    c.save();c.beginPath();c.arc(0,0,R,0,7);c.clip();c.fillStyle='rgba(60,38,26,.32)';
    c.beginPath();c.moveTo(-14,4);c.quadraticCurveTo(4,4,20,10);c.lineTo(20,24);c.lineTo(-14,24);c.closePath();c.fill();c.restore();
    // cheveux bruns
    c.fillStyle=HAIR;c.beginPath();c.arc(0,-1,R+2.4,Math.PI*.86,Math.PI*1.84);
    c.quadraticCurveTo(10,-10,-3,-6);c.quadraticCurveTo(-11,-4,-17,4);c.closePath();c.fill();
    ell(4,-19,8,4.5,HAIR,-.3);ell(-12,-2,5,9,HAIR)
  }else{
    // frange + bonnet d'infirmière
    c.fillStyle=HAIRW;c.beginPath();c.arc(0,-1,R+2.6,Math.PI*.82,Math.PI*1.9);
    c.quadraticCurveTo(12,-6,2,-11);c.quadraticCurveTo(-6,-4,-16,4);c.closePath();c.fill();
    poly([[-13,-14],[17,-16],[14,-30],[-6,-32],[-12,-26]],'#ffffff');
    c.strokeStyle='#dcdcec';c.lineWidth=1.5;c.beginPath();c.moveTo(-13,-14);c.lineTo(17,-16);c.stroke();
    fillRR(0,-28,3,10,1,'#ff2e63');fillRR(-3.5,-24.5,10,3,1,'#ff2e63')}
  // joues
  if(o.blush||eyes==='heart'||mouth===4)ell(9,5,5,3.2,'rgba(255,90,130,.45)');
  // yeux
  const ex=[4,13];

let AC=null,master=null,soundOn=true,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,d,type='sine',v=.25,delay=0){if(!soundOn||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.3,f=1000,type='lowpass',delay=0){if(!soundOn||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}

function shakeAt(t){

function uglyTurbine(t,o={}){

    c.save();c.rotate(.05);fillRR(-4.5,-24-108*k(0),9,108*k(0),3,'#a9793f');c.restore()}
  if(k(1)>0){c.save();c.translate(2,-140);c.scale(k(1),k(1));c.rotate(-.06);
    fillRR(-38,-24,76,48,7,'#b9bec8');fillRR(-38,-8,76,16,0,'#d64545');txt('RAVIOLI',0,0,12,'#fff');ell(-38,0,7,24,'#9aa0aa');
    c.strokeStyle='#8a909a';c.lineWidth=2;c.beginPath();c.moveTo(-20,-24);c.lineTo(-14,-14);c.lineTo(-22,-8);c.stroke();c.restore()}
  if(k(2)>0){

      if(fall[i]>=0){const fu=fall[i];c.translate((i-1)*30*Math.min(1,fu*1.4)+fu*(i-1)*16,dropY(0,142,fu));c.rotate(fu*(3+i))}
      c.rotate(spin*(1+i*.07)+i*2.094+Math.sin(spin*3+i)*.25);c.scale(kk,kk);
      if(i===0){lin(0,0,30,0,4,'#8a909a');ell(40,0,13,8,'#d5d9e2')}
      else if(i===1){poly([[0,-5],[46,-13],[50,10],[0,5]],'#d9b98a');lin(24,-9,26,7,1.5,'#b0905a')}

    c.save();c.translate(-8,-14);c.rotate(-.06);fillRR(-32,-12,64,20,2,'#fff');txt('TURBINE 9000',0,-1,11,'#2a2a8a');c.restore();
    circ(-24,-168,3.6,(Math.sin(t*23)>0)?'#ff3a3a':'#7a1a1a');
    c.restore()}
  c.restore()}
function sBuild(t,lt){

    P.propN=[propHammer,propIron,propDriver,propTape][ph];P.eyes=(lt*2%1)<.85?'open':'squint';P.mouth=(lt*5%1)<.5?3:1}

  else if(ct<0){P.eyes='star';P.mouth=4;P.blush=true;P.brow=-.6;P.lean=-.05;P.a2=.05;P.b2=.1;
    if(lt<12.6){P.a1=1.5;P.b1=.15}else{P.a1=1.3;P.b1=1.4}}
  else if(ct<3.6){P.eyes='wide';P.mouth=3;P.brow=-1;P.a1=.3;P.b1=.3;P.a2=.3;P.b2=.3;P.lean=-.05}
  else{P.eyes=ct<5?'closed':'squint';P.mouth=5;P.brow=.7;P.lean=.16;P.tilt=.22;P.a1=.05;P.b1=.1;P.a2=.05;P.b2=.1}
  if(lt>=20.4){dir=-1;x=lerp(rxr,-80,seg(lt,20.4,22.6));P.x=x;P.dir=-1;P.ph=x*.072;P.mouth=5;P.eyes='closed'}
  const o=person(P);
  if(lt<7.2&&lt>.8)sweatDrops(o.hx,o.hy,t);
  // établi (il bascule à la fin)
  const th=.2*ease(seg(ct,1.4,1.9));
  c.save();c.translate(bx0,GY);c.rotate(th);drawBench(bw);
  scope(230,-102,t);pcb(310,-102);
  for(let i=0;i<Math.min(4,Math.floor(lt/1.8));i++)mug(300+(i%2)*16,-102-Math.floor(i/2)*16-(i>1?0:0));
  const top=1.25*Math.pow(ease(seg(ct,1.2,1.9)),2);
  c.save();c.translate(190,-102);c.rotate(top);
  const spin=lt<7.4?0:(lt-7.4)*(1.6+Math.sin(lt*3)*.8)*(ct>0?Math.max(0,1-ct*.6):1);
  const sc=.85;c.scale(sc,sc);
  uglyTurbine(t,{stage,spin,fall:[ct-.35,ct-.8,ct-1.1].map(v=>ct>0?v:-1)});
  c.restore();c.restore();
  // fumée et grincements
  if(lt>8.3&&ct<0){for(let i=0;i<3;i++){const u=mod(t*.5+i/3,1);c.fillStyle=`rgba(120,120,125,${.5*(1-u)})`;c.beginPath();c.arc(445+u*10,GY-222-u*40,4+u*10,0,7);c.fill()}}
  // effets
  if(lt>.8&&lt<7.2){
    if(ph===0)popL('TOC ! TOC !',400,GY-230,t,lt,.9+((lt-.8)>1?0:0),.5,{fs:30,col:'#fff'});
    for(let i=0;i<6;i++){const u=mod(t*3+i/6,1),a=i*1.7;c.globalAlpha=1-u;star(400+Math.cos(a)*u*50,GY-130-Math.sin(a)*u*40,4,ph===1?'#ffe27a':'#fff',i);c.globalAlpha=1}
    const nm=['TOC ! TOC !','PSSSHHH !','BZZZZT !','RRRRIP !'][ph];
    const bt0=.8+ph*1.6;popL(nm,430,GY-250,t,lt,bt0+.1,1.4,{fs:38,col:'#ffe27a',stroke:'#3a1a12',rot:-.06})}
  if(lt>=8&&lt<9.4)popL('TADAAAM !',430,GY-270,t,lt,8.0,1.4,{fs:56,col:'#ffd166',stroke:'#7a1020',rot:-.05});
  if(lt>=8.9&&lt<10.4)popL('pouêt…',500,GY-210,t,lt,8.9,1.4,{fs:28,col:'#b8bcc6',stroke:'#333',rot:.06});
  if(ct>.35&&ct<1.4)popL('PLOC !',430,GY-100,t,lt,13.95,.8,{fs:38,col:'#fff',stroke:'#333'});
  if(ct>1.5&&ct<3)popL('CRAAAAC !!',430,GY-200,t,lt,15.1,1.6,{fs:70,col:'#ff4d4d',stroke:'#fff',rot:.06});
  if(ct>2.5&&ct<4)popL('BOUM !',560,GY-160,t,lt,16.1,1.2,{fs:50,col:'#fff',stroke:'#3a3f70',rot:-.1});
  // poussière
  if(ct>1.9){for(let i=0;i<30;i++){const s0=1.9+rnd(i)*2.5,u=ct-s0;if(u<0||u>3.4)continue;c.globalAlpha=(1-u/3.4)*.5;circ(rnd(i+11)*W,GY+rnd(i+22)*70,18+u*46,'#ece6da');c.globalAlpha=1}}
  // projecteur sur la turbine
  const sp=ease(seg(lt,7.3,7.9))*(1-ease(seg(ct,.1,.6)));

  bubble(['Allez, au boulot !'],o.hx+110,o.hy-80,o.hx+20,o.hy-40,{a:bub(lt,.1,1.2)});
  bubble(['Parfait ! C\'est exactement','ce que j\'avais imaginé !'],o.hx+180,o.hy-100,o.hx+16,o.hy-40,{fs:20,a:bub(lt,9.6,13.0)});
  bubble(['Yes !'],o.hx+90,o.hy-88,o.hx+16,o.hy-40,{a:bub(lt,13.0,13.6)});
  bubble(['…','Bon. Demain, je recommence.'],o.hx+150,o.hy-96,o.hx+16,o.hy-40,{fs:20,a:bub(lt,17.4,20.2)});
  camOff();
  const hz=ct>1.9?.28*seg(ct,1.9,3)*(1-seg(ct,5,8)):0;
  if(hz>0){c.fillStyle=`rgba(226,220,206,${hz})`;c.fillRect(0,0,W,H)}
}

/* ---------- SCÈNE 6 : retour à la maison, un peu dépité ---------- */
function drawHouse(lit,door){
  fillRR(-130,270,260,188,4,'#f0d7b3');poly([[-155,274],[0,170],[155,274]],'#b5533c');fillRR(70,190,26,50,2,'#8a3a26');

  fillRR(-40,458,80,6,0,'#b8a888')}
function sRetourR(t,lt){
  const dur=9.6,D=distF(lt,dur)*.72,Dstop=distF(dur,dur)*.72;
  bgRoad(D,1,SUNSET);
  const bxs=760+(Dstop-D),lit=lt>=13.6;

    c.strokeStyle='rgba(150,190,255,.85)';c.lineWidth=2.4;
    for(let i=0;i<14;i++){const u=mod(lt*1.5+i/14,1),x=carX-90+i*13;lin(x,326+u*130,x-4,340+u*130,2.4,'rgba(150,190,255,.85)')}

    c.globalAlpha=1}
  // médaillon
  const ik=ease(seg(lt,1.4,2.2))*(1-ease(seg(lt,9.6,10.2)));
  if(ik>.01){
    const st=lt<3?{eyes:'closed',mouth:5,brow:.7,sweat:1}:{eyes:(lt*.5%1)<.9?'squint':'closed',mouth:(lt>3.1&&lt<3.9)||(lt>6.6&&lt<7.4)?1:5,brow:.7,sweat:1,look:.4};
    c.save();c.translate(800,170);c.scale(ik,ik);c.translate(-800,-170);

  popL('Souuupir…',carX+110,300,t,lt,3.1,1.4,{fs:40,col:'#dfe4ee',stroke:'#2a2f44',rot:-.05});
  popL('Souuupir…',carX+110,300,t,lt,6.6,1.4,{fs:40,col:'#dfe4ee',stroke:'#2a2f44',rot:.05});
  if(lt>4.9&&lt<5.6)popL('Crac !',carX+60,300,t,lt,5.0,.7,{fs:34,col:'#ffe27a',stroke:'#3a1a12'});

    if(u<2.9){c.save();c.globalAlpha=1-ease(arrive);
      person(RB({x,y:472,dir:1,ph:wk<1?x*.06:null,lean:.16,mouth:5,eyes:'closed',brow:.7,tilt:.2,s:lerp(1,.9,wk),a1:.05,b1:.1,a2:.05,b2:.1}));c.restore()}}
  // FIN
  if(lt>=14.2){
    const u=ease(seg(lt,14.2,15.4));c.globalAlpha=.55*u;c.fillStyle='#101a24';c.fillRect(0,0,W,H);c.globalAlpha=1;
    c.save();c.translate(W/2,H/2-30);c.scale(u,u);
    c.font='120px Bangers, Impact, sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=18;c.strokeStyle='#1d3a12';c.strokeText('FIN',0,0);c.fillStyle='#b8f06e';c.fillText('FIN',0,0);

}

/* ---------- montage ---------- */
const SCENES=[
 {a:0,b:14,draw:sTrajet},
 {a:14,b:28,draw:sAtelier},
 {a:28,b:43,draw:sWC},
 {a:43,b:67,draw:sImagine},
 {a:67,b:90,draw:sBuild},
 {a:90,b:9999,draw:sRetourR}];
const CAPTIONS=[];

let T=0,playing=false,started=false,lastNow=0,evIdx=0,ended=false;
const $=id=>document.getElementById(id);
function frame(t){
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  const sc=SCENES.find(s=>t>=s.a&&t<s.b)||SCENES[SCENES.length-1];
  c.save();
  const sh=shakeAt(t);c.translate(sh[0],sh[1]);
  INV=c.getTransform().inverse();
  c.save();c.beginPath();c.rect(-20,-20,W+40,H+40);c.clip();
  c.font='16px Fredoka';                                       // garde les polices « chaudes »
  sc.draw(t,t-sc.a);
  c.restore();c.restore();
  // fondus entre scènes
  const dA=t-sc.a,dB=sc.b-t;let f=0;
  if(sc.a>0&&dA<.5)f=1-dA/.5;if(sc.b<9000&&dB<.5)f=Math.max(f,1-dB/.5);
  if(f>0){c.globalAlpha=ease(f);c.fillStyle='#000';c.fillRect(0,0,W,H);c.globalAlpha=1}
  // repère horaire
  const u=t-sc.a;if(u<3.2&&sc.chip){const a=u<.4?u/.4:u>2.7?(3.2-u)/.5:1;c.globalAlpha=clamp(a)*(f>.5?0:1);
    c.font='700 20px Fredoka';const w=c.measureText(sc.chip).width+30;fillRR(16,16,w,38,19,'rgba(20,16,31,.78)');c.fillStyle='#ffd166';c.textAlign='left';c.textBaseline='middle';c.fillText(sc.chip,31,36);c.globalAlpha=1}
  // sous-titres
  const cap=CAPTIONS.find(x=>t>=x[0]&&t<x[1]);
  if(cap&&cap[2]){c.font='600 20px Fredoka, sans-serif';let fs=20;while(c.measureText(cap[2]).width>W-70&&fs>14){fs--;c.font=`600 ${fs}px Fredoka, sans-serif`}
    const w=c.measureText(cap[2]).width+36;c.globalAlpha=.86;fillRR(W/2-w/2,H-46,w,34,17,'#14101f');c.globalAlpha=1;c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(cap[2],W/2,H-29)}
}
function fire(a,b){for(const e of EVENTS)if(e[0]>a&&e[0]<=b&&SFX[e[1]])try{SFX[e[1]]()}catch(_){}}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;
  if(playing){const p=T;T+=dt;if(ac())fire(p,T);
    if(!ended&&T>=TOTAL){ended=true;$('end').classList.remove('hide')}}
  frame(T);
  $('seek').value=Math.min(1000,T/TOTAL*1000);
  const s=Math.min(TOTAL,Math.floor(T));$('time').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} / ${Math.floor(TOTAL/60)}:${String(TOTAL%60).padStart(2,'0')}`;
}
function seek(t){T=clamp(t,0,TOTAL+30);ended=T>=TOTAL;$('end').classList.toggle('hide',!ended)}
function setPlaying(p){playing=p;$('pp').textContent=p?'⏸':'▶'}
function start(){ac();$('start').classList.add('hide');started=true;seek(0);setPlaying(true)}
$('go').onclick=start;
$('again').onclick=()=>{seek(0);setPlaying(true)};
$('pp').onclick=()=>{ac();if(!started){start();return}if(ended){seek(0)}setPlaying(!playing)};
$('rs').onclick=()=>{ac();$('start').classList.add('hide');started=true;seek(0);setPlaying(true)};
$('seek').oninput=e=>{seek(e.target.value/1000*TOTAL);$('start').classList.add('hide');started=true};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';ac()};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('pp').click()}});
// mode test : index.html?t=51.5 affiche directement une image de l'animation
const qs=new URLSearchParams(location.search);
if(qs.has('t')){$('start').classList.add('hide');started=true;seek(parseFloat(qs.get('t'))||0);setPlaying(qs.get('play')==='1')}
window.__seek=seek;
requestAnimationFrame(n=>{lastNow=n;loop(n)});
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{});
